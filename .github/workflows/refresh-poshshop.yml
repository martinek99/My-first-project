name: Refresh Carey's Poshmark Store

on:
  schedule:
    # 8am and 8pm Pacific
    - cron: "0 15,3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull her public closet
        run: python3 scripts/pull-poshshop.py
      - name: Save the new rack
        run: |
          git config user.name "poshshop-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desk/poshshop/stock.json desk/poshshop/updated.json
          if git diff --cached --quiet; then
            echo "closet unchanged"
            exit 0
          fi
          git commit -m "Refresh Carey's Poshmark Store from her closet"
          git push
